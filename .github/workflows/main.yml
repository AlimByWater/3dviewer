on:
  push:
    branches:
      - main

jobs:
  build:
    # Runner on the DripTech prod server 136.148.218.8; 3dviewer runs in its compose stack
    # (/srv/driptech/compose, service 3dviewer, nginx /driptech -> 127.0.0.1:3338).
    runs-on: driptech-new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg ENV_FILE=.env.production -t 3dviewer:latest .

      - name: Deploy container
        run: |
          cd /srv/driptech/compose
          docker compose up -d --no-deps --force-recreate 3dviewer
          docker image prune -f
